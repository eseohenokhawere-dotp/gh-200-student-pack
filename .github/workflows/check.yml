name: PR gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch: 
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@<SHA>
      - uses: actions/setup-python@<SHA>
        with:
          python-version: '3.12'
      - name: Run the check
        run: python labs/check.py
