name: PR gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch: 
  
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{matrix.os}}
    
    steps:
      - name: check out repository
        uses: actions/check@v7

      - name: Set up Python 
        uses: actions/setup-python@v7.0.1
        with:
          python-version: '3.12'
          
      - name: Run the check.py
        run: python labs/capstone/check.py
